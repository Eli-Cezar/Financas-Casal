<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanças do Casal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-bg: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --border: #334155;
      --border-focus: #10b981;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.2);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 16px; min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    header { text-align: center; margin-bottom: 2px; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #34d399; letter-spacing: -0.5px; }
    header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

    /* Cards e Containers */
    .balance-card, .form-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    /* Painel de Saldo */
    .balance-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
    }
    .balance-item span { display: block; font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .balance-item strong { display: block; font-size: 1.05rem; margin-top: 6px; }
    .income { color: #34d399; }
    .expense { color: #f87171; }

    /* Formulário */
    form { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; gap: 10px; }
    .form-group > * { flex: 1; }
    
    input, select {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    input::placeholder { color: #64748b; }
    input:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    /* Botão com Contorno Suave */
    button[type="submit"] {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 10px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      transition: all 0.2s ease;
    }
    button[type="submit"]:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.2);
    }

    /* Histórico */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }
    .history-header h2 { font-size: 1.15rem; font-weight: 600; }
    .filter-select {
      padding: 8px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text-muted);
    }

    ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    li {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.15s ease;
    }
    .item-left { display: flex; align-items: center; gap: 12px; }
    .category-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .category-icon.income-bg { background: var(--primary-bg); color: #34d399; }
    .category-icon.expense-bg { background: var(--danger-bg); color: #f87171; }

    .item-details strong { display: block; font-size: 0.95rem; font-weight: 600; }
    .item-details small { color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; display: block; }
    .author-badge {
      display: inline-block;
      background: #334155;
      color: #cbd5e1;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      margin-left: 6px;
      font-weight: 500;
    }

    .item-right { display: flex; align-items: center; gap: 12px; }
    .item-value { font-weight: 700; font-size: 0.95rem; }
    .delete-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 8px;
      transition: all 0.2s;
    }
    .delete-btn:hover {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
      background: var(--danger-bg);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Finanças do Casal</h1>
    <p>Gestão Compartilhada em Tempo Real</p>
  </header>

  <!-- Painel de Resumo -->
  <div class="balance-card">
    <div class="balance-item">
      <span>Entradas</span>
      <strong class="income" id="total-income">R$ 0,00</strong>
    </div>
    <div class="balance-item">
      <span>Saídas</span>
      <strong class="expense" id="total-expense">R$ 0,00</strong>
    </div>
    <div class="balance-item">
      <span>Saldo</span>
      <strong id="total-balance">R$ 0,00</strong>
    </div>
  </div>

  <!-- Formulário de Cadastro -->
  <div class="form-card">
    <form id="finance-form">
      <input type="text" id="desc" placeholder="Descrição (ex: Mercado, Aluguel)" required />
      
      <div class="form-group">
        <input type="number" step="0.01" id="amount" placeholder="Valor (R$)" required />
        <select id="type">
          <option value="expense">Saída (Despesa)</option>
          <option value="income">Entrada (Receita)</option>
        </select>
      </div>

      <div class="form-group">
        <select id="category">
          <option value="Geral">🏠 Moradia / Geral</option>
          <option value="Alimentação">🛒 Alimentação</option>
          <option value="Transporte">🛵 Transporte / Combustível</option>
          <option value="Contas">💡 Contas / Serviços</option>
          <option value="Lazer">🎉 Lazer</option>
          <option value="Salário">💵 Salário / Renda</option>
        </select>
        <select id="author">
          <option value="Eli">Pessoa: Eli</option>
          <option value="Viviane">Pessoa: Viviane</option>
        </select>
      </div>

      <button type="submit">Adicionar Transação</button>
    </form>
  </div>

  <!-- Histórico com Filtro -->
  <div class="history-header">
    <h2>Histórico</h2>
    <select id="filter-author" class="filter-select">
      <option value="all">Todos os Lançamentos</option>
      <option value="Eli">Filtrar: Eli</option>
      <option value="Viviane">Filtrar: Viviane</option>
    </select>
  </div>

  <ul id="transactions-list"></ul>
</div>

<!-- Firebase SDK via CDN Modulares -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Configuração do projeto Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyBnclw_6nuqtIqwxf5wnlMgoDWxez-kxu0",
    authDomain: "financas-casal-9f88c.firebaseapp.com",
    databaseURL: "https://financas-casal-9f88c-default-rtdb.firebaseio.com",
    projectId: "financas-casal-9f88c",
    storageBucket: "financas-casal-9f88c.firebasestorage.app",
    messagingSenderId: "458879071548",
    appId: "1:458879071548:web:c9ae2f9de1eac2d4ed5a39"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, "transacoes");

  const form = document.getElementById("finance-form");
  const list = document.getElementById("transactions-list");
  const filterAuthor = document.getElementById("filter-author");

  // Ícones por Categoria
  const categoryIcons = {
    "Moradia": "🏠",
    "Geral": "🏠",
    "Alimentação": "🛒",
    "Transporte": "🛵",
    "Contas": "💡",
    "Lazer": "🎉",
    "Salário": "💵"
  };

  let globalData = null;

  // Salvar no Firebase
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const desc = document.getElementById("desc").value;
    const amount = parseFloat(document.getElementById("amount").value);
    const type = document.getElementById("type").value;
    const category = document.getElementById("category").value;
    const author = document.getElementById("author").value;

    push(dbRef, {
      desc,
      amount,
      type,
      category: category || "Geral",
      author: author || "Eli",
      timestamp: Date.now()
    });

    form.reset();
  });

  // Renderizar a lista na tela
  function renderList() {
    if (!globalData) return;

    list.innerHTML = "";
    let incomeSum = 0;
    let expenseSum = 0;
    const selectedFilter = filterAuthor.value;

    Object.keys(globalData).forEach((id) => {
      const item = globalData[id];
      
      // Totais calculados
      if (item.type === "income") incomeSum += item.amount;
      if (item.type === "expense") expenseSum += item.amount;

      // Filtro de exibição por pessoa
      if (selectedFilter !== "all" && item.author && item.author !== selectedFilter) {
        return;
      }

      const icon = categoryIcons[item.category] || (item.type === 'income' ? '💵' : '💳');
      const bgClass = item.type === 'income' ? 'income-bg' : 'expense-bg';
      const authorTag = item.author ? `<span class="author-badge">${item.author}</span>` : '';

      const li = document.createElement("li");
      li.innerHTML = `
        <div class="item-left">
          <div class="category-icon ${bgClass}">${icon}</div>
          <div class="item-details">
            <strong>${item.desc} ${authorTag}</strong>
            <small>${item.category || 'Geral'}</small>
          </div>
        </div>
        <div class="item-right">
          <span class="item-value ${item.type}">
            ${item.type === 'expense' ? '-' : '+'} R$ ${item.amount.toFixed(2)}
          </span>
          <button class="delete-btn" onclick="deleteItem('${id}')">✕</button>
        </div>
      `;
      list.appendChild(li);
    });

    // Atualizar resumos
    document.getElementById("total-income").innerText = `R$ ${incomeSum.toFixed(2)}`;
    document.getElementById("total-expense").innerText = `R$ ${expenseSum.toFixed(2)}`;
    const balance = incomeSum - expenseSum;
    const balanceEl = document.getElementById("total-balance");
    balanceEl.innerText = `R$ ${balance.toFixed(2)}`;
    balanceEl.style.color = balance >= 0 ? "#34d399" : "#f87171";
  }

  // Escutar Firebase em Tempo Real
  onValue(dbRef, (snapshot) => {
    globalData = snapshot.val();
    renderList();
  });

  // Evento de filtro
  filterAuthor.addEventListener("change", renderList);

  // Deletar Item
  window.deleteItem = (id) => {
    remove(ref(db, `transacoes/${id}`));
  };
</script>

</body>
</html>
