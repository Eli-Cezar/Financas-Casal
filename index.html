<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanças do Casal</title>
  <style>
    :root {
      --primary: #2e7d32;
      --danger: #c62828;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #333333;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.4rem; color: var(--primary); margin-bottom: 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
    .balance-container { display: flex; justify-content: space-between; text-align: center; }
    .balance-item span { display: block; font-size: 0.8rem; color: #666; }
    .balance-item strong { font-size: 1.1rem; }
    .income { color: var(--primary); }
    .expense { color: var(--danger); }
    form { display: flex; flex-direction: column; gap: 10px; }
    input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
    button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: var(--card); padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .item-info { display: flex; flex-direction: column; }
    .item-info small { color: #888; font-size: 0.75rem; }
    .delete-btn { background: transparent; color: var(--danger); border: none; font-size: 1.1rem; cursor: pointer; padding: 4px 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Finanças do Casal</h1>

  <div class="card balance-container">
    <div class="balance-item">
      <span>Entradas</span>
      <strong class="income" id="total-income">R$ 0,00</strong>
    </div>
    <div class="balance-item">
      <span>Saídas</span>
      <strong class="expense" id="total-expense">R$ 0,00</strong>
    </div>
    <div class="balance-item">
      <span>Saldo</span>
      <strong id="total-balance">R$ 0,00</strong>
    </div>
  </div>

  <div class="card">
    <form id="finance-form">
      <input type="text" id="desc" placeholder="Descrição (ex: Mercado)" required />
      <input type="number" step="0.01" id="amount" placeholder="Valor (R$)" required />
      <select id="type">
        <option value="expense">Saída (Despesa)</option>
        <option value="income">Entrada (Receita)</option>
      </select>
      <button type="submit">Adicionar Transação</button>
    </form>
  </div>

  <h3>Histórico em Tempo Real</h3>
  <ul id="transactions-list"></ul>
</div>

<!-- Firebase SDK via CDN Modulares (compatível com navegador direto) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Configuração das suas chaves do Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyBnclw_6nuqtIqwxf5wnlMgoDWxez-kxu0",
    authDomain: "financas-casal-9f88c.firebaseapp.com",
    databaseURL: "https://financas-casal-9f88c-default-rtdb.firebaseio.com",
    projectId: "financas-casal-9f88c",
    storageBucket: "financas-casal-9f88c.firebasestorage.app",
    messagingSenderId: "458879071548",
    appId: "1:458879071548:web:c9ae2f9de1eac2d4ed5a39"
  };

  // Inicializa o Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, "transacoes");

  const form = document.getElementById("finance-form");
  const list = document.getElementById("transactions-list");

  // Salvar no Realtime Database ao enviar formulário
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const desc = document.getElementById("desc").value;
    const amount = parseFloat(document.getElementById("amount").value);
    const type = document.getElementById("type").value;

    push(dbRef, {
      desc,
      amount,
      type,
      timestamp: Date.now()
    });

    form.reset();
  });

  // Escutar e atualizar em tempo real
  onValue(dbRef, (snapshot) => {
    list.innerHTML = "";
    let incomeSum = 0;
    let expenseSum = 0;
    const data = snapshot.val();

    if (data) {
      Object.keys(data).forEach((id) => {
        const item = data[id];
        if (item.type === "income") incomeSum += item.amount;
        if (item.type === "expense") expenseSum += item.amount;

        const li = document.createElement("li");
        li.innerHTML = `
          <div class="item-info">
            <strong>${item.desc}</strong>
            <small>${item.type === 'income' ? 'Entrada' : 'Saída'}</small>
          </div>
          <div>
            <span style="font-weight: bold; margin-right: 8px;" class="${item.type}">
              ${item.type === 'expense' ? '-' : '+'} R$ ${item.amount.toFixed(2)}
            </span>
            <button class="delete-btn" onclick="deleteItem('${id}')">✕</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    // Atualiza o painel de resumos
    document.getElementById("total-income").innerText = `R$ ${incomeSum.toFixed(2)}`;
    document.getElementById("total-expense").innerText = `R$ ${expenseSum.toFixed(2)}`;
    const balance = incomeSum - expenseSum;
    const balanceEl = document.getElementById("total-balance");
    balanceEl.innerText = `R$ ${balance.toFixed(2)}`;
    balanceEl.style.color = balance >= 0 ? "var(--primary)" : "var(--danger)";
  });

  // Função para deletar um registro
  window.deleteItem = (id) => {
    remove(ref(db, `transacoes/${id}`));
  };
</script>

</body>
</html>
