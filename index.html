<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanças do Casal</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --accent-bg: rgba(249, 115, 22, 0.15);
      --primary: #34d399;
      --danger: #f87171;
      --border: #27272a;
      --border-focus: #f97316;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.7), 0 4px 6px -4px rgba(0, 0, 0, 0.5);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 16px; min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    header { text-align: center; margin-bottom: 2px; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

    /* Cards e Containers */
    .balance-card, .form-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    /* Painel de Saldo com Borda Laranja */
    .balance-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
      border: 1px solid rgba(249, 115, 22, 0.35);
      background: var(--card-bg);
    }
    .balance-item {
      padding: 10px 4px;
      border-radius: 10px;
      background: rgba(249, 115, 22, 0.05);
      border: 1px solid rgba(249, 115, 22, 0.3);
    }
    .balance-item span { 
      display: block; 
      font-size: 0.85rem; /* Fonte aumentada para melhor leitura */
      color: #fb923c; 
      font-weight: 800; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }
    .balance-item strong { 
      display: block; 
      font-size: 1.05rem; 
      margin-top: 4px; 
      font-weight: 700; 
    }
    
    /* Cores dos Valores no Painel */
    .income { color: var(--primary) !important; }
    .expense { color: var(--danger) !important; }

    /* Formulário */
    form { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .form-group > * { flex: 1 1 140px; min-width: 0; }
    .form-group > #category { flex-basis: 100%; }
    
    input, select {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: #000000;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    input::placeholder { color: #71717a; }
    input:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.25);
    }

    /* Botão Laranja */
    button[type="submit"] {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: white;
      border: 1px solid rgba(251, 146, 60, 0.4);
      border-radius: 10px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
      transition: all 0.2s ease;
    }
    button[type="submit"]:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(249, 115, 22, 0.2);
    }

    .input-with-action {
      display: flex;
      gap: 10px;
      align-items: stretch;
      flex-wrap: wrap;
    }
    .input-with-action input {
      flex: 1 1 220px;
      min-width: 0;
    }
    .secondary-btn {
      background: #27272a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      min-height: 46px;
    }
    .suggestions {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.35);
    }
    .suggestions.show {
      display: flex;
    }
    .suggestion-item {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .suggestion-item:hover {
      background: rgba(249, 115, 22, 0.12);
      border-color: rgba(249, 115, 22, 0.25);
    }
    .launch-setup {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(249, 115, 22, 0.25);
      background: rgba(249, 115, 22, 0.08);
    }
    .launch-setup.hidden {
      display: none;
    }

    /* Histórico */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }
    .history-header h2 { font-size: 1.15rem; font-weight: 600; color: var(--accent); }
    .filter-select {
      padding: 8px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
    }

    ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    li {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.15s ease;
    }
    li:hover {
      border-color: rgba(249, 115, 22, 0.4);
    }

    .item-left { display: flex; align-items: center; gap: 12px; }
    
    /* Ícone das Categorias */
    .category-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      background: var(--accent-bg);
      border: 1px solid rgba(249, 115, 22, 0.3);
      color: var(--accent);
    }

    .item-details strong { display: block; font-size: 0.95rem; font-weight: 600; color: #ffffff; }
    .item-details small { color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; display: block; }

    .item-right { display: flex; align-items: center; gap: 12px; }
    .item-value { font-weight: 700; font-size: 0.95rem; }
    
    .status-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      width: fit-content;
    }
    .status-badge.paid {
      background: #dcfce7;
      color: #166534;
    }
    .status-badge.pending {
      background: #fef3c7;
      color: #92400e;
    }
    .status-toggle {
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #000000;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .status-toggle.paid {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }
    .status-toggle.pending {
      background: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
    }
    .item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .edit-btn,
    .delete-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 8px;
      transition: all 0.2s;
    }
    .edit-btn:hover {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.3);
      background: rgba(251, 191, 36, 0.12);
    }
    .delete-btn:hover {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.12);
    }

    @media (max-width: 480px) {
      body {
        padding: 14px 10px;
      }
      .container {
        max-width: 100%;
        gap: 14px;
      }
      .balance-card {
        grid-template-columns: 1fr;
      }
      .history-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .input-with-action {
        flex-direction: column;
      }
      .secondary-btn,
      button[type="submit"] {
        width: 100%;
      }
      .form-group {
        flex-direction: column;
      }
      .form-group > * {
        flex-basis: 100%;
      }
      .form-group > #category {
        flex-basis: 100%;
      }
      .item {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .item-right {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Finanças do Casal</h1>
    <p>Gestão Compartilhada em Tempo Real</p>
  </header>

  <!-- Painel de Resumo com Bordas Laranja -->
  <div class="balance-card">
    <div class="balance-item">
      <span>Entradas</span>
      <strong class="income" id="total-income">R$ 0,00</strong>
    </div>
    <div class="balance-item">
      <span>Saídas</span>
      <strong class="expense" id="total-expense">R$ 0,00</strong>
    </div>
    <div class="balance-item">
      <span>Saldo</span>
      <strong id="total-balance">R$ 0,00</strong>
    </div>
  </div>

  <!-- Formulário de Cadastro -->
  <div class="form-card">
    <form id="finance-form">
      <div class="input-with-action">
        <input type="text" id="desc" placeholder="Descrição (ex: Mercado, Aluguel)" autocomplete="off" required />
        <button type="button" id="add-launch-btn" class="secondary-btn">Cadastrar</button>
      </div>

      <div id="desc-suggestions" class="suggestions"></div>

      <div class="form-group">
        <input type="number" step="0.01" id="amount" placeholder="Valor (R$)" required />
        <select id="type">
          <option value="expense">Saída (Despesa)</option>
          <option value="income">Entrada (Receita)</option>
        </select>
      </div>

      <div class="form-group">
        <input type="date" id="due-date" />
        <select id="payment-status">
          <option value="auto">Automático</option>
          <option value="Pago">Pago</option>
          <option value="A pagar">A pagar</option>
        </select>
        <select id="category">
          <option value="Geral">🏠 Moradia / Geral</option>
          <option value="Alimentação">🛒 Alimentação</option>
          <option value="Transporte">🛵 Transporte / Combustível</option>
          <option value="Contas">💡 Contas / Serviços</option>
          <option value="Lazer">🎉 Lazer</option>
          <option value="Salário">💵 Salário / Renda</option>
        </select>
      </div>

      <button type="submit">Adicionar Transação</button>
    </form>
  </div>

  <!-- Histórico com Filtro -->
  <div class="history-header">
    <h2>Histórico</h2>
    <select id="filter-payment-status" class="filter-select">
      <option value="all">Todos os Lançamentos</option>
      <option value="Pago">Filtrar: Pago</option>
      <option value="A pagar">Filtrar: A pagar</option>
    </select>
  </div>

  <ul id="transactions-list"></ul>
</div>

<!-- Firebase SDK via CDN Modulares -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, update } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Configuração do projeto Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyBnclw_6nuqtIqwxf5wnlMgoDWxez-kxu0",
    authDomain: "financas-casal-9f88c.firebaseapp.com",
    databaseURL: "https://financas-casal-9f88c-default-rtdb.firebaseio.com",
    projectId: "financas-casal-9f88c",
    storageBucket: "financas-casal-9f88c.firebasestorage.app",
    messagingSenderId: "458879071548",
    appId: "1:458879071548:web:c9ae2f9de1eac2d4ed5a39"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, "transacoes");

  const form = document.getElementById("finance-form");
  const list = document.getElementById("transactions-list");
  const filterPaymentStatus = document.getElementById("filter-payment-status");
  const descInput = document.getElementById("desc");
  const suggestionsBox = document.getElementById("desc-suggestions");
  const addLaunchBtn = document.getElementById("add-launch-btn");
  const submitButton = form.querySelector("button[type='submit']");

  // Ícones por Categoria
  const categoryIcons = {
    "Moradia": "🏠",
    "Geral": "🏠",
    "Alimentação": "🛒",
    "Transporte": "🛵",
    "Contas": "💡",
    "Lazer": "🎉",
    "Salário": "💵"
  };

  let globalData = null;
  let launchCatalog = {};
  let selectedLaunchId = null;
  let editingTransactionId = null;

  const launchRef = ref(db, "lancamentos");

  function toDateOnly(value) {
    if (!value) return null;
    const [year, month, day] = value.split('-').map(Number);
    return new Date(Date.UTC(year, month - 1, day));
  }

  function getAutoPaymentStatus(dueDateValue) {
    if (!dueDateValue) return "A pagar";

    const today = new Date();
    const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const dueDate = toDateOnly(dueDateValue);

    if (!dueDate) return "A pagar";
    return dueDate < todayStart ? "Pago" : "A pagar";
  }

  function resolvePaymentStatus(item) {
    if (!item?.dueDate) {
      return item?.paymentStatus || "A pagar";
    }

    if (item.statusSource === "manual") {
      return item.paymentStatus || "A pagar";
    }

    return getAutoPaymentStatus(item.dueDate);
  }

  function formatDateLabel(value) {
    if (!value) return "Sem data";
    const [year, month, day] = value.split('-').map(Number);
    return `${String(day).padStart(2, '0')}/${String(month).padStart(2, '0')}/${String(year)}`;
  }

  function resetForm() {
    form.reset();
    descInput.value = "";
    selectedLaunchId = null;
    editingTransactionId = null;
    submitButton.textContent = "Adicionar Transação";
    suggestionsBox.innerHTML = "";
    suggestionsBox.classList.remove("show");
  }

  function renderSuggestions() {
    const query = descInput.value.trim().toLowerCase();

    if (!query) {
      suggestionsBox.innerHTML = "";
      suggestionsBox.classList.remove("show");
      return;
    }

    const matches = Object.entries(launchCatalog)
      .filter(([_, item]) => (item.label || "").toLowerCase().includes(query))
      .sort((a, b) => (a[1].label || "").localeCompare(b[1].label || ""))
      .slice(0, 6);

    if (matches.length) {
      suggestionsBox.innerHTML = matches.map(([id, item]) => `
        <button type="button" class="suggestion-item" data-launch-id="${id}">
          ${item.label}
        </button>
      `).join("");
      suggestionsBox.classList.add("show");
      return;
    }

    suggestionsBox.innerHTML = `
      <button type="button" class="suggestion-item">+ Cadastrar novo lançamento</button>
    `;
    suggestionsBox.classList.add("show");
  }

  function selectLaunch(id) {
    const item = launchCatalog[id];
    if (!item) return;

    descInput.value = item.label || "";
    document.getElementById("type").value = item.type || "expense";
    document.getElementById("payment-status").value = item.paymentStatus && item.paymentStatus !== "auto" ? item.paymentStatus : "auto";
    document.getElementById("category").value = item.category || "Geral";
    selectedLaunchId = id;
    suggestionsBox.classList.remove("show");
  }

  function saveLaunchFromForm() {
    const newName = descInput.value.trim();
    if (!newName) return;

    const newLaunchRef = push(launchRef, {
      label: newName,
      type: document.getElementById("type").value,
      paymentStatus: document.getElementById("payment-status").value,
      category: document.getElementById("category").value,
      timestamp: Date.now()
    });

    selectedLaunchId = newLaunchRef.key;
    renderSuggestions();
  }

  function populateFormForEdit(id) {
    const item = globalData?.[id];
    if (!item) return;

    descInput.value = item.desc || "";
    document.getElementById("amount").value = item.amount ?? "";
    document.getElementById("type").value = item.type || "expense";
    document.getElementById("payment-status").value = item.statusSource === "manual" ? (item.paymentStatus || "A pagar") : "auto";
    document.getElementById("category").value = item.category || "Geral";
    document.getElementById("due-date").value = item.dueDate || "";
    editingTransactionId = id;
    submitButton.textContent = "Salvar Alteração";
    descInput.focus();
  }

  // Salvar no Firebase
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const desc = descInput.value.trim();
    const amount = parseFloat(document.getElementById("amount").value);
    const type = document.getElementById("type").value;
    const paymentStatusMode = document.getElementById("payment-status").value;
    const category = document.getElementById("category").value;
    const dueDate = document.getElementById("due-date").value;

    if (!desc || Number.isNaN(amount)) return;

    let paymentStatus = "A pagar";
    let statusSource = "auto";

    if (paymentStatusMode === "Pago" || paymentStatusMode === "A pagar") {
      paymentStatus = paymentStatusMode;
      statusSource = "manual";
    } else {
      paymentStatus = getAutoPaymentStatus(dueDate);
    }

    const payload = {
      desc,
      amount,
      type,
      paymentStatus,
      statusSource,
      dueDate: dueDate || null,
      category: category || "Geral",
      launchId: selectedLaunchId || null,
      timestamp: Date.now()
    };

    if (editingTransactionId) {
      update(ref(db, `transacoes/${editingTransactionId}`), payload);
    } else {
      push(dbRef, payload);
    }

    resetForm();
  });

  descInput.addEventListener("input", renderSuggestions);
  descInput.addEventListener("focus", renderSuggestions);

  addLaunchBtn.addEventListener("click", () => {
    saveLaunchFromForm();
    document.getElementById("amount").focus();
  });

  suggestionsBox.addEventListener("click", (event) => {
    const suggestionBtn = event.target.closest("button[data-launch-id]");
    if (suggestionBtn) {
      selectLaunch(suggestionBtn.dataset.launchId);
      return;
    }

    if (event.target.closest(".suggestion-item")) {
      saveLaunchFromForm();
      document.getElementById("amount").focus();
    }
  });

  function syncAutomaticStatuses() {
    if (!globalData) return;

    Object.entries(globalData).forEach(([id, item]) => {
      if (!item?.dueDate || item.statusSource === "manual") return;

      const computedStatus = getAutoPaymentStatus(item.dueDate);
      if (item.paymentStatus !== computedStatus) {
        update(ref(db, `transacoes/${id}`), {
          paymentStatus: computedStatus,
          statusSource: "auto"
        });
      }
    });
  }

  function updatePaymentStatus(id, newStatus) {
    if (!globalData?.[id]) return;

    update(ref(db, `transacoes/${id}`), {
      paymentStatus: newStatus,
      statusSource: "manual"
    });
  }

  // Renderizar a lista na tela
  function renderList() {
    if (!globalData) return;

    list.innerHTML = "";
    let incomeSum = 0;
    let expenseSum = 0;
    const selectedFilter = filterPaymentStatus.value;

    Object.keys(globalData).forEach((id) => {
      const item = globalData[id];
      
      // Totais calculados
      if (item.type === "income") incomeSum += item.amount;
      if (item.type === "expense") expenseSum += item.amount;

      // Filtro de exibição por status de pagamento
      if (selectedFilter !== "all" && item.paymentStatus !== selectedFilter) {
        return;
      }

      const icon = categoryIcons[item.category] || (item.type === 'income' ? '💵' : '💳');
      const paymentStatus = resolvePaymentStatus(item);
      const statusClass = paymentStatus === 'Pago' ? 'paid' : 'pending';
      const statusTag = `<button type="button" class="status-toggle ${statusClass}" data-id="${id}">${paymentStatus}</button>`;
      const dateLabel = item.dueDate ? `<small>Previsto para: ${formatDateLabel(item.dueDate)}</small>` : '';

      const li = document.createElement("li");
      li.innerHTML = `
        <div class="item-left">
          <div class="category-icon">${icon}</div>
          <div class="item-details">
            <strong>${item.desc}</strong>
            <small>${item.category || 'Geral'}</small>
            ${dateLabel}
            ${statusTag}
          </div>
        </div>
        <div class="item-right">
          <span class="item-value ${item.type}">
            ${item.type === 'expense' ? '-' : '+'} R$ ${item.amount.toFixed(2)}
          </span>
          <div class="item-actions">
            <button class="edit-btn" onclick="editItem('${id}')">✎</button>
            <button class="delete-btn" onclick="deleteItem('${id}')">✕</button>
          </div>
        </div>
      `;
      list.appendChild(li);
    });

    // Atualizar resumos
    document.getElementById("total-income").innerText = `R$ ${incomeSum.toFixed(2)}`;
    document.getElementById("total-expense").innerText = `R$ ${expenseSum.toFixed(2)}`;
    
    const balance = incomeSum - expenseSum;
    const balanceEl = document.getElementById("total-balance");
    balanceEl.innerText = `R$ ${balance.toFixed(2)}`;
    
    // Cor condicional do Saldo
    if (balance >= 0) {
      balanceEl.style.color = "var(--primary)";
    } else {
      balanceEl.style.color = "var(--danger)";
    }
  }

  // Escutar Firebase em Tempo Real
  onValue(dbRef, (snapshot) => {
    globalData = snapshot.val();
    syncAutomaticStatuses();
    renderList();
  });

  onValue(launchRef, (snapshot) => {
    launchCatalog = snapshot.val() || {};
    renderSuggestions();
  });

  // Evento de filtro
  filterPaymentStatus.addEventListener("change", renderList);

  list.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-id]");
    if (!button) return;

    const nextStatus = button.textContent === "Pago" ? "A pagar" : "Pago";
    updatePaymentStatus(button.dataset.id, nextStatus);
  });

  setInterval(syncAutomaticStatuses, 60000);

  window.editItem = (id) => {
    populateFormForEdit(id);
  };

  // Deletar Item
  window.deleteItem = (id) => {
    remove(ref(db, `transacoes/${id}`));
  };
</script>
